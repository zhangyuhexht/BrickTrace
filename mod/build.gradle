plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "bricktrace" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "bricktrace-gametest"
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    from("${rootDir}/../native/build/RelWithDebInfo") {
        include "bricktrace_jni.dll"
        into "natives/windows-x64"
    }
    from("${rootDir}/../native/build/shaders") {
        include "*.spv"
        into "shaders"
    }
}

tasks.withType(JavaCompile).configureEach {
    // Mixin only accepts class files up to Java 21 (version 65) even though the game runs on 25.
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_bricktrace" }
    }
}
